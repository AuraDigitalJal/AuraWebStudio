name: Aura Digital - Actualizar visitas Cloudflare
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [aura-visits-refresh]
  push:
    branches: [main]
    paths:
      - .github/workflows/visitas-web-cloudflare.yml
      - scripts/update_web_visits.py
permissions:
  contents: write
concurrency:
  group: aura-web-visits
  cancel-in-progress: false
jobs:
  visits:
    runs-on: ubuntu-latest
    env:
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Descargar Aura Web Studio
        uses: actions/checkout@v4
      - name: Estado de conexión
        if: ${{ env.CF_ANALYTICS_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "Conexión de lectura de Cloudflare pendiente. No se publican cifras inventadas."
      - name: Consultar visitas reales en Cloudflare
        if: ${{ env.CF_ANALYTICS_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: python3 scripts/update_web_visits.py
      - name: Publicar resumen sin credenciales
        if: ${{ env.CF_ANALYTICS_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Conservar la nueva estadística, sin sobrescribir otros cambios del editor.
          cp analytics/visitas.json "$RUNNER_TEMP/visitas.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/visitas.json" analytics/visitas.json
            git add analytics/visitas.json
            if git diff --cached --quiet; then
              echo "El reporte ya coincide con el guardado."
              exit 0
            fi
            git commit -m "Actualizar resumen de visitas de Aura Digital"
            if git push origin HEAD:main; then
              echo "Reporte publicado correctamente."
              exit 0
            fi
            echo "Cambio concurrente; reintentando."
            sleep 2
          done
          echo "Error: no se pudo publicar el reporte."
          exit 1
